name: PocketDAW (iOS)

on:
  push:
    paths: ['PocketDAW/**', '.github/workflows/pocketdaw.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PocketDAW
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test audio core
        run: swift test 2>&1 | tail -40
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PocketDAW.xcodeproj -scheme PocketDAW -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | grep -E "error|warning: unre|BUILD|\*\*" | head -80
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketDAW.app Payload/
          zip -qry PocketDAW-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PocketDAW-unsigned-ipa
          path: PocketDAW/PocketDAW-unsigned.ipa
