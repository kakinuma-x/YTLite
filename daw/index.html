<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PocketDAW</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PocketDAW">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
</head>
<body>
<!--APP-->
<div id="app">
  <div id="top" class="bar">
    <button id="bMenu" aria-label="メニュー">☰</button>
    <button id="bHome" aria-label="先頭へ">⏮&#xFE0E;</button>
    <button id="bPlay" aria-label="再生／停止">▶&#xFE0E;</button>
    <button id="bRec" aria-label="録音">●&#xFE0E;</button>
    <button id="bLoop" aria-label="ループ">⟲</button>
    <button id="bMetro" aria-label="メトロノーム">♩</button>
    <div class="sp"></div>
    <div id="time">1.1.1<small>0:00.0</small></div>
    <button id="bBpm" aria-label="テンポ">120<small>BPM</small></button>
  </div>
  <div id="arr">
    <div id="heads"><div id="headTop">TRACKS</div><div id="headsIn"></div></div>
    <div id="arrWrap"><canvas id="arrCv"></canvas></div>
  </div>
  <div id="clipbar" class="bar">
    <button id="bUndo" aria-label="元に戻す">↶</button>
    <button id="bRedo" aria-label="やり直す">↷</button>
    <span class="sep"></span>
    <button id="bAddTrack">＋トラック</button>
    <button id="bAddClip">＋クリップ</button>
    <span class="sep"></span>
    <button id="bDup">複製</button>
    <button id="bSplit">分割</button>
    <button id="bDel" class="dan">削除</button>
    <div class="sp"></div>
    <button id="bZoomOut" aria-label="縮小">−</button>
    <button id="bZoomIn" aria-label="拡大">＋</button>
  </div>
  <div id="panel">
    <div id="tabs">
      <button data-tab="edit">エディタ</button>
      <button data-tab="keys">演奏</button>
      <button data-tab="mix">ミキサー</button>
      <button data-tab="inst">音色</button>
      <button id="bSize" aria-label="パネルの大きさ">⇕</button>
    </div>
    <div id="pbody">
      <div class="pane" id="pEdit">
        <div id="rollBar" class="bar">
          <label for="selGrid">グリッド</label>
          <select id="selGrid">
            <option value="1">1/4</option><option value="0.5">1/8</option><option value="0.25" selected>1/16</option>
            <option value="0.125">1/32</option><option value="0.3333333333">1/8T</option><option value="0.1666666667">1/16T</option>
          </select>
          <button id="bQuant">クオンタイズ</button>
          <button id="bSelAll">全選択</button>
          <button id="bNoteDel" class="dan">ノート削除</button>
          <label for="rVel">強さ</label><input type="range" id="rVel" min="0.1" max="1" step="0.01" value="0.8" style="width:90px">
          <div class="sp"></div>
          <button id="bRZoomOut" aria-label="縮小">−</button><button id="bRZoomIn" aria-label="拡大">＋</button>
        </div>
        <div id="rollWrap"><canvas id="rollCv"></canvas></div>
        <div id="editAlt" class="scroll" hidden></div>
      </div>
      <div class="pane" id="pKeys" hidden>
        <div id="keysBar" class="bar"></div>
        <div id="keysWrap"></div>
      </div>
      <div class="pane" id="pMix" hidden><div class="scroll"><div class="strips" id="strips"></div></div></div>
      <div class="pane" id="pInst" hidden><div class="scroll" id="instBody"></div></div>
    </div>
  </div>
</div>
<input type="file" id="fileIn" accept="audio/*,.wav,.mp3,.m4a,.aac,.aif,.aiff,.ogg,.flac" hidden>
<!--/APP-->
<script src="engine.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
</html>
